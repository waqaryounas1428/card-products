<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ZUNIQUE</title>
    <link rel="stylesheet" href="./buy.css">
</head>

<body>

<div class="checkout-wrapper">

    <h1>Checkout</h1>
    <p>Please fill your details to complete the order</p>

    <section>
        <h2>Customer Information</h2>

        <div>
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">
        </div>

        <div>
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div>
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="03XXXXXXXXX">
        </div>

        <div>
            <label>Shipping Address</label>
            <textarea id="address" placeholder="Enter your full address"></textarea>
        </div>

        <div>
            <label>City</label>
            <input type="text" id="city" placeholder="Enter your city">
        </div>

        <div>
            <label>Postal Code</label>
            <input type="text" id="postal" placeholder="Postal Code">
        </div>
    </section>

    <section>
        <h2>Payment Method</h2>

        <div class="payment-option">
            <input type="radio" name="payment" id="cod" checked>
            <label for="cod">Cash on Delivery</label>
        </div>

        <div class="payment-option">
            <input type="radio" name="payment" id="card">
            <label for="card">Credit / Debit Card</label>
        </div>
    </section>

    <section>
        <h2>Order Summary</h2>
        <p>Product Price: 5000 PKR</p>
        <p>Delivery Charges: 300 PKR</p>
        <p><strong>Total Amount: 5300 PKR</strong></p>
    </section>

    <section>
        <button id="orderBtn">Place Order</button>
    </section>

</div>

<script>
document.getElementById("orderBtn").addEventListener("click", function () {
    let name    = document.getElementById("name").value.trim();
    let email   = document.getElementById("email").value.trim();
    let phone   = document.getElementById("phone").value.trim();
    let address = document.getElementById("address").value.trim();
    let city    = document.getElementById("city").value.trim();
    let postal  = document.getElementById("postal").value.trim();

    if (!name || !email || !phone || !address || !city || !postal) {
        alert("Please fill in all fields");
        return;
    }

    let orderData = {
        name, email, phone, address, city, postal,
        payment: document.querySelector('input[name="payment"]:checked').nextElementSibling.innerText
    };

    localStorage.setItem("orderData", JSON.stringify(orderData));
    window.location.href = "success.html";
});
</script>

</body>
</html>
