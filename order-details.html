<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details | ZUNIQUE</title>
    <link rel="stylesheet" href="order-detail.css">
</head>
<body>

<div class="page-wrapper">

    <!-- HEADER -->
    <div class="od-header">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back to Shop</button>
        <h1>🛒 Order Details</h1>
        <p>View and manage your recent order</p>
    </div>

    <!-- ORDER CARD -->
    <div class="order-card" id="orderBox">

        <!-- ORDER INFO (read-only view) -->
        <div class="order-info" id="orderView">
            <div class="info-row">
                <span class="info-label">📦 Product</span>
                <span class="info-value" id="view-product">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">💰 Price</span>
                <span class="info-value price-val" id="view-price">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">📋 Status</span>
                <span class="info-value" id="view-status">—</span>
            </div>
        </div>

        <!-- EDIT FORM (hidden by default) -->
        <div class="edit-form" id="editForm" style="display:none;">
            <div class="field-group">
                <label>Product Name</label>
                <input type="text" id="product" placeholder="Enter product name">
            </div>
            <div class="field-group">
                <label>Price (PKR)</label>
                <input type="number" id="price" placeholder="Enter price">
            </div>
            <div class="field-group">
                <label>Status</label>
                <input type="text" id="status" placeholder="e.g. Confirmed, Pending">
            </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="btns" id="viewBtns">
            <button class="edit-btn" onclick="showEditForm()">✏️ Edit Order</button>
            <button class="delete-btn" onclick="deleteOrder()">🗑️ Delete Order</button>
        </div>

        <div class="btns" id="editBtns" style="display:none;">
            <button class="save-btn" onclick="saveOrder()">✅ Save Changes</button>
            <button class="cancel-btn" onclick="cancelEdit()">✖ Cancel</button>
        </div>

    </div>

    <!-- NO ORDER MESSAGE -->
    <div class="no-order-card" id="noOrderCard" style="display:none;">
        <div class="no-order-icon">📭</div>
        <h3>No Order Found</h3>
        <p>You haven't placed any order yet.</p>
        <button class="shop-btn" onclick="window.location.href='index.html'">Start Shopping</button>
    </div>

</div>

<script>
    // Load order from localStorage
    let order = JSON.parse(localStorage.getItem("order"));

    if (order) {
        showOrder(order);
    } else {
        document.getElementById("orderBox").style.display = "none";
        document.getElementById("noOrderCard").style.display = "block";
    }

    function showOrder(o) {
        document.getElementById("view-product").innerText = o.product || "—";
        document.getElementById("view-price").innerText   = "Rs. " + Number(o.price).toLocaleString();
        document.getElementById("view-status").innerText  = o.status || "—";

        // Status badge color
        const statusEl = document.getElementById("view-status");
        if (o.status === "Confirmed") {
            statusEl.style.color = "#16a34a";
            statusEl.style.background = "#dcfce7";
        } else if (o.status === "Pending") {
            statusEl.style.color = "#d97706";
            statusEl.style.background = "#fef3c7";
        } else {
            statusEl.style.color = "#7c3aed";
            statusEl.style.background = "#ede9fe";
        }
        statusEl.style.padding = "3px 12px";
        statusEl.style.borderRadius = "20px";
        statusEl.style.fontWeight = "700";
    }

    function showEditForm() {
        document.getElementById("product").value = order.product;
        document.getElementById("price").value   = order.price;
        document.getElementById("status").value  = order.status;

        document.getElementById("orderView").style.display = "none";
        document.getElementById("editForm").style.display  = "block";
        document.getElementById("viewBtns").style.display  = "none";
        document.getElementById("editBtns").style.display  = "flex";
    }

    function cancelEdit() {
        document.getElementById("orderView").style.display = "block";
        document.getElementById("editForm").style.display  = "none";
        document.getElementById("viewBtns").style.display  = "flex";
        document.getElementById("editBtns").style.display  = "none";
    }

    function saveOrder() {
        let product = document.getElementById("product").value.trim();
        let price   = document.getElementById("price").value.trim();
        let status  = document.getElementById("status").value.trim();

        if (!product || !price || !status) {
            alert("Please fill in all fields.");
            return;
        }

        order = { product, price, status };
        localStorage.setItem("order", JSON.stringify(order));
        showOrder(order);
        cancelEdit();

        // Show success toast
        showToast("✅ Order updated successfully!");
    }

    function deleteOrder() {
        if (confirm("Are you sure you want to delete this order?")) {
            localStorage.removeItem("order");
            document.getElementById("orderBox").style.display   = "none";
            document.getElementById("noOrderCard").style.display = "block";
        }
    }

    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2800);
    }
</script>

<!-- TOAST -->
<div id="toast"></div>

</body>
</html>
